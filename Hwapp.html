<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Homework Planner</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; padding-bottom: 80px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 24px; color: var(--accent-color); margin-bottom: 4px; }
    header p { font-size: 14px; color: var(--text-muted); }
    .tabs { display: flex; background: var(--card-bg); border-radius: 12px; padding: 4px; margin-bottom: 20px; border: 1px solid var(--border-color); }
    .tab-btn { flex: 1; background: none; border: none; color: var(--text-muted); padding: 12px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; }
    .tab-btn.active { background: var(--bg-color); color: var(--accent-color); border: 1px solid var(--border-color); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .input-group { background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
    select, input, button { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-size: 15px; outline: none; }
    select:focus, input:focus { border-color: var(--accent-color); }
    button.add-btn { background: var(--accent-color); color: var(--bg-color); font-weight: bold; border: none; cursor: pointer; }
    .homework-list { display: flex; flex-direction: column; gap: 12px; }
    .homework-item { background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .homework-item.completed { opacity: 0.5; }
    .homework-item.completed .hw-text { text-decoration: line-through; color: var(--text-muted); }
    .hw-info { flex: 1; }
    .hw-meta { font-size: 12px; color: var(--accent-color); font-weight: bold; margin-bottom: 4px; }
    .hw-text { font-size: 16px; word-break: break-all; }
    .hw-actions { display: flex; gap: 8px; }
    .action-btn { padding: 6px 12px; font-size: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
    .complete-btn { background: #22c55e; color: white; }
    .delete-btn { background: #ef4444; color: white; }
    .schedule-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
    .schedule-table th, .schedule-table td { padding: 12px; text-align: center; border: 1px solid var(--border-color); }
    .schedule-table th { background: var(--bg-color); color: var(--accent-color); }
    .calc-screen { background: #000; color: #fff; text-align: right; padding: 24px; font-size: 40px; border-radius: 12px; margin-bottom: 12px; min-height: 90px; word-break: break-all; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .calc-btn { background: #334155; color: #fff; font-size: 24px; height: 70px; border-radius: 50%; border: none; font-weight: bold; display: flex; justify-content: center; align-items: center; }
    .calc-btn.operator { background: #f97316; }
    .calc-btn.function { background: #cbd5e1; color: #000; }
    .calc-btn.zero { grid-column: span 2; border-radius: 35px; }
  </style>
</head>
<body>

  <header>
    <h1>My Planner</h1>
    <p>Personal Homework & Calculator</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('homework')">Homework</button>
    <button class="tab-btn" onclick="switchTab('schedule')">Schedule</button>
    <button class="tab-btn" onclick="switchTab('calculator')">Calc</button>
  </div>

  <div id="homework" class="tab-content active">
    <div class="input-group">
      <select id="subject-select">
        <option value="World History">World History</option>
        <option value="ELA">ELA</option>
        <option value="Life Science">Life Science</option>
        <option value="Math G6">Math G6</option>
        <option value="Pre-Algebra">Pre-Algebra</option>
        <option value="PE / Health">PE / Health</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" id="homework-input" placeholder="Enter assignment details...">
      <button class="add-btn" onclick="addHomework()">Add Assignment</button>
    </div>
    <div class="homework-list" id="homework-list"></div>
  </div>

  <div id="schedule" class="tab-content">
    <table class="schedule-table">
      <thead>
        <tr>
          <th>Period</th>
          <th>A Day</th>
          <th>B Day</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Per 1</td><td>PE / Health</td><td>Life Science</td></tr>
        <tr><td>Per 2</td><td>World History</td><td>Math G6</td></tr>
        <tr><td>Per 3</td><td>ELA</td><td>Pre-Algebra</td></tr>
        <tr><td>Per 4</td><td>Elective</td><td>Support</td></tr>
      </tbody>
    </table>
  </div>

  <div id="calculator" class="tab-content">
    <div class="calc-screen" id="calc-display">0</div>
    <div class="calc-grid">
      <button class="calc-btn function" onclick="clearCalc()">C</button>
      <button class="calc-btn function" onclick="inputCalc('±')">±</button>
      <button class="calc-btn function" onclick="inputCalc('%')">%</button>
      <button class="calc-btn operator" onclick="inputCalc('/')">÷</button>
      <button class="calc-btn" onclick="inputCalc('7')">7</button>
      <button class="calc-btn" onclick="inputCalc('8')">8</button>
      <button class="calc-btn" onclick="inputCalc('9')">9</button>
      <button class="calc-btn operator" onclick="inputCalc('*')">×</button>
      <button class="calc-btn" onclick="inputCalc('4')">4</button>
      <button class="calc-btn" onclick="inputCalc('5')">5</button>
      <button class="calc-btn" onclick="inputCalc('6')">6</button>
      <button class="calc-btn operator" onclick="inputCalc('-')">-</button>
      <button class="calc-btn" onclick="inputCalc('1')">1</button>
      <button class="calc-btn" onclick="inputCalc('2')">2</button>
      <button class="calc-btn" onclick="inputCalc('3')">3</button>
      <button class="calc-btn operator" onclick="inputCalc('+')">+</button>
      <button class="calc-btn zero" onclick="inputCalc('0')">0</button>
      <button class="calc-btn" onclick="inputCalc('.')">.</button>
      <button class="calc-btn operator" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    // 전역 변수로 데이터 배열 선언
    let homeworks = [];

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if(event && event.currentTarget) {
        event.currentTarget.classList.add('active');
      }
    }

    function renderHomework() {
      const listEl = document.getElementById("homework-list");
      if (!listEl) return;
      listEl.innerHTML = "";
      
      if (homeworks.length === 0) {
        listEl.innerHTML = "<p style='text-align:center; color:gray; padding:20px;'>No assignments active!</p>";
        return;
      }

      homeworks.forEach((item, index) => {
        const itemEl = document.createElement("div");
        itemEl.className = `homework-item ${item.completed ? 'completed' : ''}`;
        itemEl.innerHTML = `
          <div class="hw-info">
            <div class="hw-meta">[${item.subject}]</div>
            <div class="hw-text">${item.text}</div>
          </div>
          <div class="hw-actions">
            <button class="action-btn complete-btn" onclick="toggleComplete(${index})">${item.completed ? 'Undo' : 'Done'}</button>
            <button class="action-btn delete-btn" onclick="deleteHomework(${index})">Del</button>
          </div>
        `;
        listEl.appendChild(itemEl);
      });
    }

    function addHomework() {
      const subject = document.getElementById("subject-select").value;
      const text = document.getElementById("homework-input").value.trim();
      
      if (!text) return alert("Please enter details!");

      homeworks.push({ subject, text, completed: false });
      saveAndRender();
      document.getElementById("homework-input").value = "";
    }

    function toggleComplete(index) {
      homeworks[index].completed = !homeworks[index].completed;
      saveAndRender();
    }

    function deleteHomework(index) {
      if (confirm("Delete this assignment?")) {
        homeworks.splice(index, 1);
        saveAndRender();
      }
    }

    function saveAndRender() {
      localStorage.setItem('my_homeworks', JSON.stringify(homeworks));
      renderHomework();
    }

    // 계산기 로직
    let calcInput = "";
    function inputCalc(val) {
      if (document.getElementById("calc-display").innerText === "0" && !isNaN(val)) {
        calcInput = val;
      } else {
        calcInput += val;
      }
      document.getElementById("calc-display").innerText = calcInput;
    }
    function clearCalc() {
      calcInput = "0";
      document.getElementById("calc-display").innerText = calcInput;
    }
    function calculate() {
      try {
        let result = eval(calcInput.replace('×', '*').replace('÷', '/'));
        calcInput = String(result);
        document.getElementById("calc-display").innerText = calcInput;
      } catch (e) {
        document.getElementById("calc-display").innerText = "Error";
        calcInput = "";
      }
    }

    // 페이지 로드가 완전히 끝난 후 데이터를 불러오고 화면을 그립니다.
    window.onload = function() {
      const savedData = localStorage.getItem('my_homeworks');
      if (savedData) {
        homeworks = JSON.parse(savedData);
      } else {
        homeworks = [];
      }
      renderHomework();
    };
  </script>
</body>
</html>
