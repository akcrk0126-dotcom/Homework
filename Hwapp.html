<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate School Planner</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; padding-bottom: 80px; }
    header { text-align: center; margin-bottom: 16px; }
    header h1 { font-size: 24px; color: var(--accent-color); margin-bottom: 4px; }
    
    /* 디데이 바 */
    .dday-bar { background: linear-gradient(135deg, #1e293b, #334155); border: 1px solid var(--border-color); padding: 10px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: bold; color: #f43f5e; margin-bottom: 16px; }
    
    /* 퀵링크 버튼 */
    .quick-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .link-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 10px; border-radius: 8px; font-size: 12px; font-weight: bold; text-decoration: none; text-align: center; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .link-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }

    .tabs { display: flex; background: var(--card-bg); border-radius: 12px; padding: 4px; margin-bottom: 20px; border: 1px solid var(--border-color); overflow-x: auto; }
    .tab-btn { flex: 1; min-width: 70px; background: none; border: none; color: var(--text-muted); padding: 12px 8px; font-size: 13px; font-weight: 600; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--bg-color); color: var(--accent-color); border: 1px solid var(--border-color); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .input-group { background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
    select, input, button { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-size: 15px; outline: none; }
    select:focus, input:focus { border-color: var(--accent-color); }
    input[type="date"] { color-scheme: dark; }
    button.add-btn { background: var(--accent-color); color: var(--bg-color); font-weight: bold; border: none; cursor: pointer; }
    
    .list-container { display: flex; flex-direction: column; gap: 12px; }
    .item-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .item-card.completed { opacity: 0.5; }
    .item-card.completed .item-text { text-decoration: line-through; color: var(--text-muted); }
    .item-info { flex: 1; }
    .item-meta { font-size: 12px; color: var(--accent-color); font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .item-date { color: #f43f5e; }
    .item-text { font-size: 16px; word-break: break-all; }
    .item-actions { display: flex; gap: 8px; }
    .action-btn { padding: 6px 12px; font-size: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; }
    .complete-btn { background: #22c55e; color: white; }
    .delete-btn { background: #ef4444; color: white; }
    
    .schedule-table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
    .schedule-table th, .schedule-table td { padding: 12px; text-align: center; border: 1px solid var(--border-color); font-size: 14px; }
    .schedule-table th { background: var(--bg-color); color: var(--accent-color); }
    
    .calc-screen { background: #000; color: #fff; text-align: right; padding: 24px; font-size: 40px; border-radius: 12px; margin-bottom: 12px; min-height: 90px; word-break: break-all; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .calc-btn { background: #334155; color: #fff; font-size: 24px; height: 70px; border-radius: 50%; border: none; font-weight: bold; display: flex; justify-content: center; align-items: center; }
    .calc-btn.operator { background: #f97316; }
    .calc-btn.function { background: #cbd5e1; color: #000; }
    .calc-btn.zero { grid-column: span 2; border-radius: 35px; }

    .memo-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; }
    .memo-textarea { width: 100%; height: 150px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 12px; border-radius: 8px; resize: none; font-size: 15px; outline: none; line-height: 1.5; }
    .memo-textarea:focus { border-color: var(--accent-color); }
  </style>
</head>
<body>

  <header>
    <h1>My Master Planner</h1>
  </header>

  <div class="dday-bar" id="dday-counter">⏳ Calculating Summer Break D-Day...</div>

  <div class="quick-links">
    <a href="https://classroom.google.com" target="_blank" class="link-btn">📁 Classroom</a>
    <a href="https://sie.getalma.com" target="_blank" class="link-btn">🏫 SIE Alma</a>
    <a href="https://google.com" target="_blank" class="link-btn">🔍 Google</a>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('homework')">Homework</button>
    <button class="tab-btn" onclick="switchTab('exams')">Exams</button>
    <button class="tab-btn" onclick="switchTab('schedule')">Schedule</button>
    <button class="tab-btn" onclick="switchTab('calculator')">Calc</button>
    <button class="tab-btn" onclick="switchTab('memo')">Memo</button>
  </div>

  <div id="homework" class="tab-content active">
    <div class="input-group">
      <select id="subject-select">
        <option value="World History">World History</option>
        <option value="ELA">ELA</option>
        <option value="Life Science">Life Science</option>
        <option value="Math G6">Math G6</option>
        <option value="Pre-Algebra">Pre-Algebra</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Study Hall">Study Hall</option>
        <option value="Music / Art">Music / Art</option>
        <option value="PE / Health">PE / Health</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" id="homework-input" placeholder="Enter assignment details...">
      <input type="date" id="due-input">
      <button class="add-btn" onclick="addHomework()">Add Assignment</button>
    </div>
    <div class="list-container" id="homework-list"></div>
  </div>

  <div id="exams" class="tab-content">
    <div class="input-group">
      <select id="exam-subject-select">
        <option value="World History">World History</option>
        <option value="ELA">ELA</option>
        <option value="Life Science">Life Science</option>
        <option value="Math G6">Math G6</option>
        <option value="Pre-Algebra">Pre-Algebra</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Music / Art">Music / Art</option>
        <option value="Other">Other</option>
      </select>
      <input type="text" id="exam-input" placeholder="Enter exam topics / chapters...">
      <input type="date" id="exam-date-input">
      <button class="add-btn" onclick="addExam()">Add Exam Schedule</button>
    </div>
    <div class="list-container" id="exam-list"></div>
  </div>

  <div id="schedule" class="tab-content">
    <table class="schedule-table">
      <thead>
        <tr>
          <th>Period</th>
          <th>A Day</th>
          <th>B Day</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Per 1</td><td>PE / Health</td><td>Life Science</td></tr>
        <tr><td>Per 2</td><td>World History</td><td>Music / Art</td></tr>
        <tr><td>Per 3</td><td>ELA</td><td>Pre-Algebra</td></tr>
        <tr><td>Per 4</td><td>Computer Science</td><td>Study Hall / Math G6</td></tr>
      </tbody>
    </table>
  </div>

  <div id="calculator" class="tab-content">
    <div class="calc-screen" id="calc-display">0</div>
    <div class="calc-grid">
      <button class="calc-btn function" onclick="clearCalc()">C</button>
      <button class="calc-btn function" onclick="inputCalc('±')">±</button>
      <button class="calc-btn function" onclick="inputCalc('%')">%</button>
      <button class="calc-btn operator" onclick="inputCalc('/')">÷</button>
      <button class="calc-btn" onclick="inputCalc('7')">7</button>
      <button class="calc-btn" onclick="inputCalc('8')">8</button>
      <button class="calc-btn" onclick="inputCalc('9')">9</button>
      <button class="calc-btn operator" onclick="inputCalc('*')">×</button>
      <button class="calc-btn" onclick="inputCalc('4')">4</button>
      <button class="calc-btn" onclick="inputCalc('5')">5</button>
      <button class="calc-btn" onclick="inputCalc('6')">6</button>
      <button class="calc-btn operator" onclick="inputCalc('-')">-</button>
      <button class="calc-btn" onclick="inputCalc('1')">1</button>
      <button class="calc-btn" onclick="inputCalc('2')">2</button>
      <button class="calc-btn" onclick="inputCalc('3')">3</button>
      <button class="calc-btn operator" onclick="inputCalc('+')">+</button>
      <button class="calc-btn zero" onclick="inputCalc('0')">0</button>
      <button class="calc-btn" onclick="inputCalc('.')">.</button>
      <button class="calc-btn operator" onclick="calculate()">=</button>
    </div>
  </div>

  <div id="memo" class="tab-content">
    <div class="memo-box">
      <h3 style="margin-bottom: 10px; font-size: 16px; color: var(--accent-color);">Today's Quick Notes</h3>
      <textarea class="memo-textarea" id="memo-input" placeholder="Type reminders or notes here... (Auto saves!)" oninput="saveMemo()"></textarea>
    </div>
  </div>

  <script>
    let homeworks = [];
    let exams = [];

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if(event && event.currentTarget) {
        event.currentTarget.classList.add('active');
      }
    }

    function updateDday() {
      const targetDate = new Date("2026-06-19T00:00:00");
      const today = new Date();
      const difference = targetDate - today;
      const days = Math.ceil(difference / (1000 * 60 * 60 * 24));
      
      const counterEl = document.getElementById("dday-counter");
      if (days > 0) {
        counterEl.innerText = `☀️ Summer Break: D-${days} left!`;
      } else if (days === 0) {
        counterEl.innerText = `🎉 Summer Break Starts TODAY!`;
      } else {
        counterEl.innerText = `🏝️ Enjoying Summer Break!`;
      }
    }

    // --- 숙제 로직 ---
    function renderHomework() {
      const listEl = document.getElementById("homework-list");
      if (!listEl) return;
      listEl.innerHTML = "";
      
      if (homeworks.length === 0) {
        listEl.innerHTML = "<p style='text-align:center; color:gray; padding:20px;'>No assignments active!</p>";
        return;
      }

      homeworks.sort((a, b) => {
        if (!a.due) return 1;
        if (!b.due) return -1;
        return new Date(a.due) - new Date(b.due);
      });

      homeworks.forEach((item, index) => {
        const itemEl = document.createElement("div");
        itemEl.className = `item-card ${item.completed ? 'completed' : ''}`;
        let dueText = item.due ? `Due: ${item.due}` : "No Due Date";
        itemEl.innerHTML = `
          <div class="item-info">
            <div class="item-meta"><span>[${item.subject}]</span><span class="item-date">${dueText}</span></div>
            <div class="item-text">${item.text}</div>
          </div>
          <div class="item-actions">
            <button class="action-btn complete-btn" onclick="toggleComplete(${index})">${item.completed ? 'Undo' : 'Done'}</button>
            <button class="action-btn delete-btn" onclick="deleteHomework(${index})">Del</button>
          </div>
        `;
        listEl.appendChild(itemEl);
      });
    }

    function addHomework() {
      const subject = document.getElementById("subject-select").value;
      const text = document.getElementById("homework-input").value.trim();
      const due = document.getElementById("due-input").value;
      if (!text) return alert("Please enter details!");
      homeworks.push({ subject, text, due, completed: false });
      localStorage.setItem('my_homeworks', JSON.stringify(homeworks));
      renderHomework();
      document.getElementById("homework-input").value = "";
      document.getElementById("due-input").value = "";
    }

    function toggleComplete(index) {
      homeworks[index].completed = !homeworks[index].completed;
      localStorage.setItem('my_homeworks', JSON.stringify(homeworks));
      renderHomework();
    }

    function deleteHomework(index) {
      if (confirm("Delete this assignment?")) {
        homeworks.splice(index, 1);
        localStorage.setItem('my_homeworks', JSON.stringify(homeworks));
        renderHomework();
      }
    }

    // --- 시험 로직 (새로 추가) ---
    function renderExams() {
      const listEl = document.getElementById("exam-list");
      if (!listEl) return;
      listEl.innerHTML = "";

      if (exams.length === 0) {
        listEl.innerHTML = "<p style='text-align:center; color:gray; padding:20px;'>No upcoming exams!</p>";
        return;
      }

      // 시험 날짜 빠른 순 정렬
      exams.sort((a, b) => {
        if (!a.date) return 1;
        if (!b.date) return -1;
        return new Date(a.date) - new Date(b.date);
      });

      exams.forEach((item, index) => {
        const itemEl = document.createElement("div");
        itemEl.className = `item-card ${item.completed ? 'completed' : ''}`;
        
        let ddayText = "";
        if (item.date) {
          const diff = new Date(item.date) - new Date(new Date().setHours(0,0,0,0));
          const dday = Math.ceil(diff / (1000 * 60 * 60 * 24));
          ddayText = dday > 0 ? `D-${dday}` : (dday === 0 ? "TODAY" : "Passed");
        }

        itemEl.innerHTML = `
          <div class="item-info">
            <div class="item-meta"><span>[${item.subject}]</span><span class="item-date" style="color:#e11d48;">${item.date || ""} (${ddayText})</span></div>
            <div class="item-text">${item.text}</div>
          </div>
          <div class="item-actions">
            <button class="action-btn complete-btn" onclick="toggleExamComplete(${index})">${item.completed ? 'Undo' : 'Done'}</button>
            <button class="action-btn delete-btn" onclick="deleteExam(${index})">Del</button>
          </div>
        `;
        listEl.appendChild(itemEl);
      });
    }

    function addExam() {
      const subject = document.getElementById("exam-subject-select").value;
      const text = document.getElementById("exam-input").value.trim();
      const date = document.getElementById("exam-date-input").value;
      if (!text) return alert("Please enter exam details!");
      exams.push({ subject, text, date, completed: false });
      localStorage.setItem('my_exams', JSON.stringify(exams));
      renderExams();
      document.getElementById("exam-input").value = "";
      document.getElementById("exam-date-input").value = "";
    }

    function toggleExamComplete(index) {
      exams[index].completed = !exams[index].completed;
      localStorage.setItem('my_exams', JSON.stringify(exams));
      renderExams();
    }

    function deleteExam(index) {
      if (confirm("Delete this exam schedule?")) {
        exams.splice(index, 1);
        localStorage.setItem('my_exams', JSON.stringify(exams));
        renderExams();
      }
    }

    function saveMemo() {
      const memoText = document.getElementById("memo-input").value;
      localStorage.setItem('my_memo', memoText);
    }

    // 계산기 로직
    let calcInput = "";
    function inputCalc(val) {
      if (document.getElementById("calc-display").innerText === "0" && !isNaN(val)) {
        calcInput = val;
      } else {
        calcInput += val;
      }
      document.getElementById("calc-display").innerText = calcInput;
    }
    function clearCalc() {
      calcInput = "0";
      document.getElementById("calc-display").innerText = calcInput;
    }
    function calculate() {
      try {
        let result = eval(calcInput.replace('×', '*').replace('÷', '/'));
        calcInput = String(result);
        document.getElementById("calc-display").innerText = calcInput;
      } catch (e) {
        document.getElementById("calc-display").innerText = "Error";
        calcInput = "";
      }
    }

    window.onload = function() {
      const savedData = localStorage.getItem('my_homeworks');
      if (savedData) homeworks = JSON.parse(savedData);
      renderHomework();

      const savedExams = localStorage.getItem('my_exams');
      if (savedExams) exams = JSON.parse(savedExams);
      renderExams();

      const savedMemo = localStorage.getItem('my_memo');
      if (savedMemo) document.getElementById("memo-input").value = savedMemo;

      updateDday();
    };
  </script>
</body>
</html>
